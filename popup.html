<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Spotify Stretch</h1>
    <button id="power" class="power" aria-pressed="false">Off</button>
  </header>
  <p id="status" class="status"></p>

  <section>
    <label for="speed">Speed <output id="speedOut"></output></label>
    <input id="speed" type="range" min="1" max="2" step="0.01">
    <div class="presets">
      <button data-speed="1.1">1.1</button>
      <button data-speed="1.2">1.2</button>
      <button data-speed="1.25">1.25</button>
      <button data-speed="1.3">1.3</button>
      <button data-speed="1.5">1.5</button>
    </div>
  </section>

  <section>
    <label for="bass">Bass <output id="bassOut"></output></label>
    <input id="bass" type="range" min="0" max="12" step="0.5">
  </section>

  <section>
    <label for="reverb">Reverb <output id="reverbOut"></output></label>
    <input id="reverb" type="range" min="0" max="1" step="0.01">
  </section>

  <script src="popup.js"></script>
</body>
</html>
