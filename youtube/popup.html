<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Faster / Slower</h1>
    <button id="power" class="power" aria-pressed="false">Off</button>
  </header>
  <p id="status" class="status"></p>

  <section>
    <label for="speed">Speed <output id="speedOut"></output></label>
    <input id="speed" type="range" min="0.5" max="2" step="0.01">
    <div class="presets">
      <button data-speed="0.75">0.75</button>
      <button data-speed="0.8">0.8</button>
      <button data-speed="0.85">0.85</button>
      <button data-speed="0.9">0.9</button>
      <button data-speed="1">1</button>
    </div>
    <div class="presets">
      <button data-speed="1.1">1.1</button>
      <button data-speed="1.2">1.2</button>
      <button data-speed="1.25">1.25</button>
      <button data-speed="1.5">1.5</button>
      <button data-speed="2">2</button>
    </div>
  </section>

  <section>
    <label for="pitch">Pitch <output id="pitchOut"></output></label>
    <input id="pitch" type="range" min="-18" max="18" step="0.1">
    <div class="row">
      <label class="check"><input id="tape" type="checkbox"> Tape mode</label>
      <button id="pitchReset" class="small">Reset pitch</button>
    </div>
    <p id="pitchHint" class="hint"></p>
  </section>

  <section>
    <div class="row first">
      <label class="check"><input id="picture" type="checkbox"> Keep picture in sync</label>
    </div>
    <label for="sync" class="second">Fine-tune <output id="syncOut"></output></label>
    <input id="sync" type="range" min="-150" max="150" step="5">
    <p class="hint">The sound arrives about 0.15 s late; the picture is held back to match. If lips look early or late, move the slider.</p>
  </section>

  <section>
    <label for="bass">Bass <output id="bassOut"></output></label>
    <input id="bass" type="range" min="0" max="12" step="0.5">
  </section>

  <section>
    <label for="tail">Drum tail <output id="tailOut"></output></label>
    <input id="tail" type="range" min="0" max="1" step="0.01">
  </section>

  <section>
    <label for="reverb">Reverb <output id="reverbOut"></output></label>
    <input id="reverb" type="range" min="0" max="1" step="0.01">
  </section>

  <footer class="footer"><span id="version"></span></footer>

  <script src="popup.js"></script>
</body>
</html>
